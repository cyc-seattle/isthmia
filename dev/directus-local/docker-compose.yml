# Local-only Directus + Postgres, for applying and testing packages/crm/schema.yaml against a real
# instance. Never deployed — production's Directus is packages/infrastructure/src/crm/cluster.ts.
# Holds no real data, so credentials below are fixed and literally fake, not generated.
#
# Directus version is pinned to match production (packages/infrastructure/src/crm/cluster.ts);
# a snapshot regenerated against a different version would record a version that doesn't match the
# pinned image (#101).
#
# No Google OIDC, no oauth2-proxy, no Caddy — none of that is needed to apply a schema or exercise
# permission rules through the REST API directly. No license, so Directus doesn't enforce relational
# permission filters here. features/community-rules.feature checks them on dev's licensed instance.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus
    volumes:
      - postgres_data:/var/lib/postgresql/data

  directus:
    image: directus/directus:12.5.1
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8055:8055"
    environment:
      KEY: local-dev-key
      SECRET: local-dev-secret
      # License activation rejects Directus's relative default.
      PUBLIC_URL: http://localhost:8055
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: directus
      ADMIN_EMAIL: directus@example.com
      ADMIN_PASSWORD: directus

volumes:
  postgres_data:
