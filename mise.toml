[settings]
lockfile = true

[tools]
node = "22"
pnpm = "10.34.6"
lefthook = "2"
pulumi = "3.192.0"
# Needs a system Python on macOS.
gcloud = "latest"
rumdl = "latest"
jq = "latest"
# For psql. The major matches the Cloud SQL instance (packages/infrastructure/src/infrastructure/database.ts).
postgres = "16"
kubectl = "1.36"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
CLOUDSDK_ACTIVE_CONFIG_NAME = "isthmia"
GCP_PROJECT = "cyc-admin-scripts"
CLOUDSDK_CORE_PROJECT = "{{ env.GCP_PROJECT }}"
PULUMI_STACK = "{{ get_env(name='PULUMI_STACK', default='prod') }}"
# Each stack's state lives in its own environment's bucket, from cyc-seattle/platform's bootstrap.
PULUMI_BACKEND_URL = "gs://{{ env.GCP_PROJECT }}-pulumi-{{ env.PULUMI_STACK }}"
# Actions' auth step sets this, so keep it when set. Otherwise it's the main checkout's .gcloud/, even
# from a worktree, so every worktree shares one login.
GOOGLE_APPLICATION_CREDENTIALS = "{{ get_env(name='GOOGLE_APPLICATION_CREDENTIALS', default=exec(command='dirname \"$(git rev-parse --path-format=absolute --git-common-dir)\"') ~ '/.gcloud/application_default_credentials.json') }}"

[tasks.install]
description = "Install dependencies, git hooks, and the GKE tools Pulumi's Kubernetes provider and db-shell run"
run = [
  "./scripts/gen-sdks",
  "pnpm install",
  "lefthook install",
  "gcloud components install gke-gcloud-auth-plugin --quiet",
]

[tasks.format]
description = "Format the repo"
run = ["pnpm exec prettier --write .", "pnpm exec eslint --fix ."]

[tasks.check]
description = "Run formatting, linting, and type checks"
run = "./scripts/check"

[tasks.test]
description = "Run all tests"
wait_for = ["check"]
run = "vitest run"

[tasks.ci]
description = "Run the CI checks"
depends = ["check", "test"]

[tasks.build]
description = "Build all packages"
depends = ["install"]
run = "pnpm run -r build"

[tasks.clean]
description = "Clean all packages"
run = "pnpm run -r clean"

[tasks.create-config]
description = "Create the isthmia gcloud configuration and point it at the project"
run = "./scripts/create-config"

[tasks.auth-gcp]
description = "Log in to gcloud as a deployer, in the isthmia configuration"
depends = ["create-config"]
run = "gcloud auth login"

[tasks.auth-adc]
description = "Point Application Default Credentials at your own gcloud login"
run = "./scripts/auth-adc"

[tasks.doctor]
description = "Check auth, tooling, and docker state; fixes what it can at a TTY, otherwise just reports"
run = "./scripts/doctor"

# scripts/each-stack picks the projects, in order, from PULUMI_STACK.
[tasks.deploy]
description = "Build, then apply $PULUMI_STACK's Pulumi projects non-interactively, in order"
depends = ["doctor"]
run = [{ task = "build" }, "./scripts/each-stack up --yes"]

[tasks.preview]
description = "Show the Pulumi diff `mise run deploy` would apply to $PULUMI_STACK, without applying it"
depends = ["doctor"]
run = "./scripts/each-stack preview"

# Changes no resource, but rewrites state, so an out-of-band edit shows up as a diff on the next deploy.
[tasks.refresh]
description = "Reconcile $PULUMI_STACK's Pulumi state with what actually exists"
depends = ["doctor"]
run = "./scripts/each-stack refresh --yes"

# Needs the dev deploy, so it isn't part of ci.
[tasks.integration]
description = "Run the integration features against dev, as your ADC login (deploy-dev in Actions)"
run = "./scripts/integration"

[tasks.reset]
description = "Empty dev's CRM, reseed its fakes, and run both syncs, keeping Directus's database and activation"
run = "./scripts/reset"

[tasks.db-shell]
description = "Open psql on a database of $PULUMI_STACK's, from a throwaway pod in its namespace"
usage = 'arg "<database>" help="The database, such as authentik, directus, or clubspot_fake"'
run = './scripts/db-shell "${usage_database}"'

[tasks.directus-local]
description = "Bring up local Directus + Postgres containers and apply every package's schema.yaml to them"
run = "./scripts/directus-local up"

[tasks.directus-local-down]
description = "Tear down the local Directus + Postgres containers and their volume"
run = "./scripts/directus-local down"

[tasks.ssh]
description = "Open an IAP-tunnelled SSH session to the substrate VM"
run = "./scripts/ssh"

[tasks.logs]
description = "Tail a service's container logs on the substrate VM"
usage = 'arg "<service>" help="The service to tail"'
run = './scripts/logs "${usage_service}"'

[tasks.db-tunnel]
description = "Forward localhost:<port> to Cloud SQL through the substrate VM (only needed to poke it with psql)"
usage = 'arg "[port]" default="5432" help="The local port"'
run = './scripts/db-tunnel "${usage_port}"'
